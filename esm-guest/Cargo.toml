[package]
name = "esm-guest"
version = "0.1.0"
edition = "2021"
publish = false
description = "rv32im guest harness around esm-core (stand-in for the SP1 / RISC Zero guest): batch run + T6 check"

[dependencies]
esm-core = { path = "../esm-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true      # same as the shipped esm-core profile

[profile.dev]
panic = "abort"

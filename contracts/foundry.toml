[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./vectors" }]
ffi = false

[fuzz]
runs = 3000
seed = "0x45534d"
max_test_rejects = 1000000

[invariant]
runs = 256
depth = 128
fail_on_revert = false
call_override = false
